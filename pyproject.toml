[project]
name = "agent-kit"
version = "0.1.0"
description = "Ingest -> tool-calling agent -> auditable decision. HackAlem AI starter."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.100",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
